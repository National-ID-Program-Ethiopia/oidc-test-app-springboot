server:
  port: 3000   # matches the Django REDIRECT_URI (http://localhost:3000/...)

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: fayda-bank

  security:
    oauth2:
      client:
        registration:
          fayda:
            # Loaded from the CLIENT_ID entry in .env
            client-id: ${CLIENT_ID}
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:3000/callback
            scope:
              - openid
              - profile
              - email
        provider:
          fayda:
            # Each endpoint comes straight from its own .env entry
            authorization-uri: ${FAYDA_AUTHORIZATION_URI}
            token-uri: ${FAYDA_TOKEN_URI}
            user-info-uri: ${FAYDA_USER_INFO_URI}
            jwk-set-uri: ${FAYDA_JWK_SET_URI}
            user-name-attribute: sub

# PRIVATE_KEY (the base64-encoded JWK) is read directly from .env by
# OAuthClientConfig via @Value("${PRIVATE_KEY}") to sign the private_key_jwt
# client assertion — no separate key file needed.
# PRIVATE_KEY_USER_INFO (optional, falls back to PRIVATE_KEY) is read by
# UserInfoDecoder to decrypt JWE userinfo responses.

# Keep Spring Security at INFO: at DEBUG/TRACE it logs the whole OAuth2AuthenticationToken,
# i.e. every userinfo claim (name, phone, address, base64 picture) on login and on each request.
logging:
  level:
    org.springframework.security: INFO
