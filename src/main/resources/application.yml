server:
  port: 3000

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: fayda-bank

  security:
    oauth2:
      client:
        registration:
          fayda:
            client-id: ${CLIENT_ID}
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:3000/callback
            scope:
              - openid
              - profile
              - email
        provider:
          fayda:
            authorization-uri: ${FAYDA_AUTHORIZATION_URI}
            token-uri: ${FAYDA_TOKEN_URI}
            user-info-uri: ${FAYDA_USER_INFO_URI}
            jwk-set-uri: ${FAYDA_JWK_SET_URI}
            user-name-attribute: sub

logging:
  level:
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security: DEBUG
